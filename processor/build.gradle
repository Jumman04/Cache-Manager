plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.jummania'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
}