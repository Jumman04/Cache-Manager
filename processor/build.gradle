plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.jummania'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "net.ltgt.gradle.incap:incap-processor:1.0.0"
    implementation "net.ltgt.gradle.incap:incap:1.0.0"
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
}