plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.jummania'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':processor')
    annotationProcessor project(':processor')
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
}